# Меню сайта и карточки на главной странице.
#
# Поля занятия:
#   work         — номер занятия (им же помечены страницы: work: 1)
#   title        — название (в меню и на карточке)
#   description  — описание на карточке главной страницы
#   tags         — метки на карточке
#   image        — картинка для карточки (необязательно), например assets/img/task_1.jpg
#   soon: true   — занятие ещё не готово: карточка «Скоро», в меню не показывается
