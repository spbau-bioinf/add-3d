    </pattern>
  </defs>
  <rect width="450" height="200" fill="#fbfcfe"/>
  <g stroke="#30465a" stroke-width="1.7" stroke-linejoin="round">
    <path d="M21 76a101 101 0 0 0 202 0h-12a89 89 0 0 1-178 0z" fill="url(#bone)"/>
