# ---------------------------------------------------------------
# Настройки сайта. После изменения этого файла GitHub пересоберёт
# сайт сам; при локальном просмотре перезапустите jekyll serve.
# ---------------------------------------------------------------

title: "Цифровой конвейер 3D-производства"

# Боковая панель
brand_title: "3D · 2026"
brand_sub: "Цифровой конвейер 3D-производства<br>Представление и обработка трёхмерных данных"

# Главная страница
home:
  # картинка в кружке, например assets/img/avatar.png; пусто — значок emoji
  avatar: ""
  emoji: "🧵"
  title: "Цифровой конвейер 3D-производства"
  subtitle: "Кафедра биоинформатики и математической биологии · СПбАУ РАН им. Ж. И. Алферова"
  intro: "Теория, разобранные примеры и задания к практическим занятиям: от трёхмерной модели и слайсера до G-кода, траекторий печати и анализа данных, которые получает принтер."
  # кнопки под описанием; icon: code, chat, mail, play, book или link
  links:
    - title: "Занятия"
      url: "#works"
      icon: book
    - title: "Просмотрщик G-кода"
      url: "viewer.html"
      icon: play
    - title: "GitHub"
      # замените на адрес своего репозитория
      url: "https://github.com/spbau-bioinf"
      icon: code
  # ссылки в верхней строке
  topnav:
    - title: "Занятия"
      url: "#works"
    - title: "Просмотрщик"
      url: "viewer.html"
    - title: "GitHub"
      url: "https://github.com/spbau-bioinf"
  works_title: "Практические занятия"

# Инструменты: отдельный пункт в боковом меню (url — путь от корня сайта)
tools:
  - url: viewer.html
    code: "tool"
    title: "Просмотрщик G-кода"

# Подпись в конце страниц (отключается в странице: show_author: false)
author: "Подготовил: Ерофеев А.И."

# Подвал
footer:
  - "© 2026 СПбАУ РАН им. Ж. И. Алферова · Кафедра биоинформатики и математической биологии"
  - "Санкт-Петербург"

# Все страницы используют один шаблон
defaults:
  - scope:
      path: ""
    values:
      layout: default

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  # подсвечивать и блоки ```text (нужно для подписей блоков)
  guess_lang: true
  # не превращать прямые кавычки в «умные»
  smart_quotes: ["apos", "apos", "quot", "quot"]

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
